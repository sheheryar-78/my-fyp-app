name: Build Expo Mobile APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'Frontend/mobile/package-lock.json'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: ./Frontend/mobile
        run: npm install

      - name: Prebuild Expo to generate Android folder
        working-directory: ./Frontend/mobile
        run: npx expo prebuild --platform android --clean

      - name: Build Android APK
        working-directory: ./Frontend/mobile/android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-App-APK
          path: Frontend/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
