name: Build Expo Mobile APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'Frontend/mobile/package-lock.json'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: ./Frontend/mobile
        run: npm install

      - name: Prebuild Expo to generate Android folder
        working-directory: ./Frontend/mobile
        run: npx expo prebuild --platform android --clean

      - name: Build Android Release APK
        working-directory: ./Frontend/mobile/android
        run: ./gradlew assembleRelease

      - name: Sign APK
        working-directory: ./Frontend/mobile/android
        run: |
          keytool -genkey -v -keystore my-release-key.keystore -alias my-key-alias -keyalg RSA -keysize 2048 -validity 10000 -storepass password -keypass password -dname "CN=FYP, OU=App, O=App, L=City, ST=State, C=US"
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          $BUILD_TOOLS_DIR/apksigner sign --ks my-release-key.keystore --ks-pass pass:password --key-pass pass:password --out app-release-signed.apk $APK_FILE

      - name: Create Release and Upload Signed APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: signed-release
          name: Latest Signed Release Build
          files: Frontend/mobile/android/app-release-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
